<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="studio-token" content="__STUDIO_TOKEN__">
<title>studio</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #15171a; color: #d7dae0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  li { list-style: none; }
  ul { padding: 0; margin: 0; }
</style>
</head>
<body>
<h1>studio: connected to the server</h1>
<ul id="log"></ul>
<script>
// Placeholder shell: shows the server's events. The player replaces this page.
const log = document.getElementById("log");
const es = new EventSource("/__events");
for (const name of ["hello", "reload", "audio-stale", "audio-ready", "audio-error"]) {
  es.addEventListener(name, (e) => { const li = document.createElement("li"); li.textContent = `${name} ${e.data}`; log.prepend(li); });
}
</script>
</body>
</html>
